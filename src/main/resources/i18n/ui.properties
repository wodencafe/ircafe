# Network user lookup preferences
preferences.network.userLookups.title=User lookups
preferences.network.userLookups.help=Optional fallbacks for account/away/host info (USERHOST / WHOIS), with conservative rate limits.
preferences.network.userLookups.helpButton.title=Why do I need user lookups?
preferences.network.userLookups.helpButton.message=Most modern IRC networks provide account and presence information via IRCv3 (e.g., account-tag, account-notify, away-notify, extended-join).\n\nHowever, some networks (or some pieces of data) still require fallback lookups. IRCafe can optionally use USERHOST and (as a last resort) WHOIS to fill missing metadata.\n\nIf you're on an IRCv3-capable network and don't use hostmask-based ignore rules, you can usually leave these disabled.
preferences.network.userLookups.preset.conservative=Conservative
preferences.network.userLookups.preset.balanced=Balanced
preferences.network.userLookups.preset.rapid=Rapid
preferences.network.userLookups.preset.custom=Custom
preferences.network.userLookups.preset.conservative.hint=Lowest traffic. Best for huge channels or strict networks.
preferences.network.userLookups.preset.balanced.hint=Recommended default. Good fill-in speed with low risk.
preferences.network.userLookups.preset.rapid.hint=Faster fill-in. More commands on the wire (use with caution).
preferences.network.userLookups.preset.custom.hint=Custom shows the tuning controls below.
preferences.network.userLookups.field.ratePreset=Rate limit preset:
preferences.network.userLookups.field.monitorIsonPoll=MONITOR fallback poll (sec):
preferences.network.userLookups.monitorIsonPoll.tooltip=Polling interval for ISON monitor fallback when IRC MONITOR is unavailable.
preferences.network.userLookups.hostmask.section=Hostmask discovery
preferences.network.userLookups.hostmask.enabled=Fill missing hostmasks using USERHOST (rate-limited)
preferences.network.userLookups.hostmask.enabled.tooltip=When enabled, IRCafe may send USERHOST only when hostmask-based ignore rules exist and some nicks are missing hostmasks.
preferences.network.userLookups.hostmask.help.title=Why do I need hostmask discovery?
preferences.network.userLookups.hostmask.help.message=Some ignore rules rely on hostmasks (nick!user@host).\n\nOn many networks, the full hostmask isn't included in NAMES and might not be available until additional lookups happen.\n\nIf you use hostmask-based ignore rules and some users show up without hostmasks, IRCafe can send rate-limited USERHOST commands to fill them in.\n\nIf you don't use hostmask-based ignores, you can usually leave this off.
preferences.network.userLookups.userhost.minInterval.tooltip=Minimum seconds between USERHOST commands per server.
preferences.network.userLookups.userhost.maxPerMinute.tooltip=Maximum USERHOST commands per minute per server.
preferences.network.userLookups.userhost.nickCooldown.tooltip=Cooldown in minutes before re-querying the same nick.
preferences.network.userLookups.userhost.maxNicks.tooltip=How many nicks to include per USERHOST command (servers typically allow up to 5).
preferences.network.userLookups.field.minInterval=Min interval (sec):
preferences.network.userLookups.field.maxCommands=Max commands/min:
preferences.network.userLookups.field.nickCooldown=Nick cooldown (min):
preferences.network.userLookups.field.maxNicks=Max nicks/command:
preferences.network.userLookups.enrichment.section=Roster enrichment (fallback)
preferences.network.userLookups.enrichment.enabled=Best-effort roster enrichment using USERHOST (rate-limited)
preferences.network.userLookups.enrichment.enabled.tooltip=When enabled, IRCafe may send USERHOST occasionally to enrich user info even when you don't have hostmask-based ignore rules.\nThis is a best-effort fallback for older networks.
preferences.network.userLookups.enrichment.whoisFallback=Also use WHOIS fallback for account info (very slow)
preferences.network.userLookups.enrichment.whoisFallback.tooltip=When enabled, IRCafe may occasionally send WHOIS to learn account login state/name and away message.\nThis is slower and more likely to hit server rate limits. Recommended OFF by default.
preferences.network.userLookups.enrichment.periodicRefresh=Periodic background refresh (slow scan)
preferences.network.userLookups.enrichment.periodicRefresh.tooltip=When enabled, IRCafe will periodically re-check a small number of nicks to detect changes.\nUse conservative intervals to avoid extra network load.
preferences.network.userLookups.enrichment.help.title=Why do I need roster enrichment?
preferences.network.userLookups.enrichment.help.message=This is a best-effort fallback for older networks or edge cases where IRCv3 metadata isn't available.\n\nIRCafe can use rate-limited USERHOST to fill missing user info. Optionally it can also use WHOIS (much slower) to learn account/away details.\n\nOn modern IRCv3 networks, you typically don't need this. Leave it OFF unless you have a specific reason.
preferences.network.userLookups.enrichment.whoisHelp.title=WHOIS fallback
preferences.network.userLookups.enrichment.whoisHelp.message=WHOIS is the slowest and noisiest fallback. It can provide account and away information when IRCv3 isn't available, but it is easy to hit server throttles.\n\nKeep this OFF unless you're on a network that doesn't provide account info via IRCv3.
preferences.network.userLookups.enrichment.refreshHelp.title=Periodic background refresh
preferences.network.userLookups.enrichment.refreshHelp.message=This periodically re-probes a small number of users to detect changes (e.g., account/away state) on networks that don't push updates.\n\nIt's a slow scan by design: use high intervals and small batch sizes to avoid extra network load.
preferences.network.userLookups.enrichment.userhost.minInterval.tooltip=Minimum seconds between USERHOST commands per server for enrichment.
preferences.network.userLookups.enrichment.userhost.maxPerMinute.tooltip=Maximum USERHOST commands per minute per server for enrichment.
preferences.network.userLookups.enrichment.userhost.nickCooldown.tooltip=Cooldown in minutes before re-querying the same nick via USERHOST (enrichment).\nHigher values reduce network load.
preferences.network.userLookups.enrichment.userhost.maxNicks.tooltip=How many nicks to include per USERHOST command (servers typically allow up to 5).\nThis applies to enrichment mode, separate from hostmask discovery.
preferences.network.userLookups.enrichment.whois.minInterval.tooltip=Minimum seconds between WHOIS commands per server (enrichment).\nKeep this high to avoid throttling.
preferences.network.userLookups.enrichment.whois.nickCooldown.tooltip=Cooldown in minutes before re-WHOIS'ing the same nick.
preferences.network.userLookups.enrichment.refresh.interval.tooltip=How often to run a slow scan tick (seconds).\nHigher values are safer. Example: 300 seconds (5 minutes).
preferences.network.userLookups.enrichment.refresh.nicksPerTick.tooltip=How many nicks to probe per periodic tick.\nKeep this small (e.g., 1-3).
