preferences.ircv3.title=IRCv3
preferences.ircv3.subtitle=Typing and capability settings for modern IRCv3 features. Capability changes apply on reconnect.
preferences.ircv3.typing.section=Typing indicators
preferences.ircv3.typing.help.title=Typing indicators
preferences.ircv3.typing.help.message=What it is:\nTyping indicators show when someone is actively typing or has paused.\n\nImpact in IRCafe:\n- Send: broadcasts your typing state to peers when supported.\n- Display: shows incoming typing state in the active UI.\n\nIf disabled:\n- Send disabled: IRCafe won't broadcast your typing state.\n- Display disabled: IRCafe won't render incoming typing indicators.
