preferences.diagnostics.title=Diagnostics
preferences.diagnostics.help=Configure optional application diagnostics integrations exposed under the Application tree node.\nStartup-related changes apply after restarting IRCafe.
preferences.diagnostics.assertj.section=AssertJ Swing / EDT watchdog
preferences.diagnostics.assertj.enabled=Enable AssertJ Swing diagnostics
preferences.diagnostics.assertj.enabled.tooltip=Installs AssertJ Swing (or a fallback detector) for EDT thread violation checks.
preferences.diagnostics.assertj.freezeWatchdog=Enable EDT freeze watchdog
preferences.diagnostics.assertj.freezeWatchdog.tooltip=Reports prolonged Event Dispatch Thread stalls into Application -> AssertJ Swing.
preferences.diagnostics.assertj.freezeThresholdMs=Freeze threshold (ms)
preferences.diagnostics.assertj.watchdogPollMs=Watchdog poll (ms)
preferences.diagnostics.assertj.fallbackViolationReportMs=Fallback violation report interval (ms)
preferences.diagnostics.assertj.issueSound=Play sound when an issue is detected
preferences.diagnostics.assertj.issueSound.tooltip=Uses the configured tray notification sound when EDT freeze/violation issues are detected.
preferences.diagnostics.assertj.issueNotification=Show desktop notification when an issue is detected
preferences.diagnostics.assertj.issueNotification.tooltip=Uses the tray notification pipeline; desktop-notification delivery still follows tray settings.
preferences.diagnostics.assertj.help=Watchdog logs stalls when EDT lag exceeds the threshold. Fallback interval controls how often off-EDT Swing violations are re-reported.
preferences.diagnostics.jhiccup.section=jHiccup integration
preferences.diagnostics.jhiccup.enabled=Enable jHiccup process integration
preferences.diagnostics.jhiccup.enabled.tooltip=Runs an external jHiccup process and mirrors output into Application -> jHiccup.
