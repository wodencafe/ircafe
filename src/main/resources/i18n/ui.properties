preferences.network.proxy.section=SOCKS5 proxy
preferences.network.proxy.help.title=SOCKS5 proxy
preferences.network.proxy.help.message=When enabled, IRCafe routes IRC connections, link previews, embedded images, and file downloads through a SOCKS5 proxy.\n\nHeads up: proxy credentials are stored in your runtime config file in plain text.
preferences.network.proxy.blurb=Routes IRC + embeds through SOCKS5. Use remote DNS if local DNS is blocked.
preferences.network.proxy.enabled=Use SOCKS5 proxy
preferences.network.proxy.remoteDns=Proxy resolves DNS (remote DNS)
preferences.network.proxy.remoteDns.tooltip=When enabled, IRCafe asks the proxy to resolve hostnames. Useful if local DNS is blocked.
preferences.network.tls.section=TLS / SSL
preferences.network.tls.help.title=TLS / SSL (Trust all certificates)
preferences.network.tls.help.message=This setting is intentionally dangerous. If enabled, IRCafe will accept any TLS certificate (expired, mismatched, self-signed, etc)\nfor IRC-over-TLS connections and for HTTPS fetching (link previews, embedded images, etc).\n\nOnly enable this if you understand the risk (MITM becomes trivial).
preferences.network.tls.blurb=If enabled, certificate validation is skipped (insecure). Only use for debugging.
preferences.network.tls.trustAll=Trust all TLS/SSL certificates (insecure)
preferences.network.heartbeat.section=Connection heartbeat
preferences.network.heartbeat.help.title=Connection heartbeat
preferences.network.heartbeat.help.message=IRCafe can detect 'silent' disconnects by monitoring inbound traffic.\nIf no IRC messages are received for the configured timeout, IRCafe will close the socket\nand let the reconnect logic take over (if enabled).\n\nTip: If your network is very quiet, increase the timeout.
preferences.network.heartbeat.blurb=Detects silent disconnects by closing idle sockets so reconnect can kick in.
preferences.network.heartbeat.enabled=Enable heartbeat / idle timeout detection
preferences.network.bouncer.section=Bouncer discovery defaults
preferences.network.bouncer.help.title=Bouncer discovery defaults
preferences.network.bouncer.help.message=These defaults are used by the generic bouncer mapping strategy for discovered networks.\n\nUse a login template to shape derived usernames.\nUse hint preference to accept or ignore login user hints sent by the bouncer.
preferences.network.bouncer.blurb=Controls how generic bouncer-discovered networks map to ephemeral server login users.
preferences.network.bouncer.preferLoginHint=Prefer login user hint from discovery payloads
preferences.network.bouncer.templateHelp=Template tokens: {base} and {network}. Example: {base}/{network}
preferences.network.validation.proxyHostRequired=Proxy host is required when proxy is enabled.
preferences.network.validation.proxyPortRange=Proxy port must be 1..65535.
preferences.network.validation.heartbeatTimeoutGreater=Timeout must be greater than check period.
