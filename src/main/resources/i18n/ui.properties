preferences.history.lockViewport.enabled=Lock viewport during load older
preferences.history.lockViewport.tooltip=When enabled, IRCafe keeps your initial top visible message anchored for the full load.\nWhen disabled, IRCafe uses adaptive chunk anchoring so you can keep scrolling during load.
