preferences.ircv3.typing.send.tooltip=When enabled, IRCafe will send your IRCv3 typing state (active/paused/done) when the server supports it.
preferences.ircv3.typing.receive=Display incoming typing indicators (IRCv3)
preferences.ircv3.typing.receive.tooltip=When enabled, IRCafe will display incoming IRCv3 typing indicators from other users.
preferences.ircv3.typing.treeDisplay=Show typing marker next to channels
preferences.ircv3.typing.treeDisplay.tooltip=Controls typing markers in the server tree channel list.\nTyping transport behavior is unchanged.
preferences.ircv3.typing.usersListDisplay=Show typing marker next to users
preferences.ircv3.typing.usersListDisplay.tooltip=Controls typing markers beside nicknames in the channel user list.\nTyping transport behavior is unchanged.
preferences.ircv3.typing.transcriptDisplay=Show typing status in the transcript input area
preferences.ircv3.typing.transcriptDisplay.tooltip=Controls the incoming typing banner above the input field ("X is typing").\nTyping transport behavior is unchanged.
preferences.ircv3.typing.sendSignalDisplay=Show local typing-send arrows near Send
preferences.ircv3.typing.sendSignalDisplay.tooltip=Controls the local send telemetry arrows near the Send button.\nTyping transport behavior is unchanged.
