preferences.ircv3.typing.treeStyle.keyboard=Keyboard glyph
preferences.ircv3.typing.treeStyle.glowDot=Glowing green dot
preferences.ircv3.typing.treeStyle.tooltip=Choose how typing activity appears in the server tree for channels.
preferences.ircv3.field.serverTreeMarkerStyle=Server tree marker style
preferences.ircv3.typing.impact=Send controls your outbound typing state; Display controls incoming typing state from others.\nDisplay toggles control where typing hints render: server tree, user list, transcript, and send telemetry arrows.\nMatrix user list names controls whether Matrix users render as display name only or as display name + Matrix user ID.\nServer tree marker style controls the channel typing activity indicator.\nShow unread/highlight badges toggles server tree notification count badges.\nUnread badge size scales channel unread/highlight count badges in the server tree.
