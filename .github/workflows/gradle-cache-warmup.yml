name: Warm Gradle dependency caches

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/gradle-cache-warmup.yml"
      - "build.gradle"
      - "settings.gradle"
      - "gradle/**"
      - "ircafe-*/build.gradle"
  schedule:
    # Refresh shared caches before GitHub's seven-day inactivity eviction.
    - cron: "23 5 * * 1,4"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gradle-cache-warmup-${{ github.ref }}
  cancel-in-progress: true

jobs:
  warm-cache:
    # Only the default branch can provide caches to future release tags.
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
          - os: ubuntu-24.04-arm
          - os: windows-latest
          - os: macos-15
          - os: macos-15-intel
    runs-on: ${{ matrix.os }}
    env:
      JAVA_TOOL_OPTIONS: -Djava.awt.headless=true

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Resolve application and test dependencies
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon :bootJar :testClasses :functionalTestClasses --stacktrace
