name: Manual Test Build

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Branch, tag, or SHA to build. Leave blank to use the Actions UI branch selector."
        required: false
        type: string
      target:
        description: "Artifact to build and attach to this workflow run"
        required: true
        type: choice
        options:
          - jar
          - flatpak
          - linux
          - windows
          - mac

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ inputs.target }}
    runs-on: ${{ inputs.target == 'windows' && 'windows-latest' || inputs.target == 'mac' && 'macos-15' || inputs.target == 'linux' && 'ubuntu-24.04' || 'ubuntu-latest' }}

    steps:
      - name: Checkout selected ref
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref != '' && inputs.source_ref || github.ref }}

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare build metadata
        shell: bash
        run: |
          set -euo pipefail

          source_ref="${{ inputs.source_ref }}"
          if [[ -z "$source_ref" ]]; then
            source_ref="${GITHUB_REF_NAME}"
          fi

          ref_slug="$(printf '%s' "$source_ref" | sed -E 's/[^A-Za-z0-9._-]+/-/g; s/^-+//; s/-+$//')"
          if [[ -z "$ref_slug" ]]; then
            ref_slug="detached"
          fi
          ref_slug="${ref_slug:0:40}"

          short_sha="$(git rev-parse --short=8 HEAD)"
          release_version="0.0.0"
          build_label="${ref_slug}-${short_sha}-run${GITHUB_RUN_NUMBER}"

          case "${{ inputs.target }}" in
            jar)
              artifact_name="ircafe-${build_label}-bootjar"
              artifact_path="build/libs/ircafe-${release_version}.jar"
              ;;
            flatpak)
              artifact_name="ircafe-${build_label}-linux-x64-flatpak"
              artifact_path="ircafe-${build_label}-linux-x64.flatpak"
              ;;
            linux)
              artifact_name="ircafe-${build_label}-linux-x64"
              artifact_path="ircafe-${build_label}-linux-x64.tar.gz"
              ;;
            windows)
              artifact_name="ircafe-${build_label}-windows-x64"
              artifact_path="ircafe-${build_label}-windows-x64.zip"
              ;;
            mac)
              artifact_name="ircafe-${build_label}-macos-arm64"
              artifact_path="ircafe-${build_label}-macos-arm64.zip"
              ;;
            *)
              echo "::error::Unsupported build target: ${{ inputs.target }}"
              exit 1
              ;;
          esac

          echo "SOURCE_REF=${source_ref}" >> "$GITHUB_ENV"
          echo "REF_SLUG=${ref_slug}" >> "$GITHUB_ENV"
          echo "SHORT_SHA=${short_sha}" >> "$GITHUB_ENV"
          echo "RELEASE_VERSION=${release_version}" >> "$GITHUB_ENV"
          echo "BUILD_LABEL=${build_label}" >> "$GITHUB_ENV"
          echo "ARTIFACT_NAME=${artifact_name}" >> "$GITHUB_ENV"
          echo "ARTIFACT_PATH=${artifact_path}" >> "$GITHUB_ENV"

      - name: Build bootJar
        if: inputs.target == 'jar'
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon clean bootJar -Pversion=${RELEASE_VERSION} --info --stacktrace -x test
          test -f "${ARTIFACT_PATH}"

      - name: Build app-image with jpackage
        if: inputs.target == 'linux' || inputs.target == 'windows' || inputs.target == 'mac'
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon clean jpackage -Pversion=${RELEASE_VERSION} --info --stacktrace -x test

      - name: Install Linux packaging tools
        if: inputs.target == 'linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y fakeroot dpkg-dev rpm

      - name: Build Linux DEB and RPM packages
        if: inputs.target == 'linux'
        shell: bash
        run: bash packaging/linux/build-native-packages.sh "${RELEASE_VERSION}"

      - name: Verify and stage Linux packages
        if: inputs.target == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          for format in deb rpm; do
            packages=(build/installer/"${format}"/*."${format}")
            if [[ ${#packages[@]} -ne 1 || ! -f "${packages[0]}" ]]; then
              echo "::error::Expected exactly one ${format} package"
              exit 1
            fi
            image=ubuntu:24.04
            if [[ "$format" == rpm ]]; then image=fedora:43; fi
            docker run --rm \
              -v "$PWD/build:/packages:ro" \
              -v "$PWD/packaging/linux:/checks:ro" \
              "$image" bash /checks/test-native-package.sh \
              "/packages/installer/${format}/$(basename "${packages[0]}")" \
              "/packages/installer-test/previous.${format}"
            cp "${packages[0]}" "ircafe-${BUILD_LABEL}-linux-x64.${format}"
          done

      - name: Add WiX to PATH (Windows)
        if: inputs.target == 'windows'
        shell: pwsh
        run: |
          if (-not $env:WIX) { throw 'WiX Toolset is not installed on this runner' }
          $wixBin = Join-Path $env:WIX 'bin'
          foreach ($tool in @('candle.exe', 'light.exe')) {
            if (-not (Test-Path (Join-Path $wixBin $tool))) { throw "Missing WiX tool: $tool" }
          }
          $wixBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build Windows MSI
        if: inputs.target == 'windows'
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon jpackageMsi -Pversion=${RELEASE_VERSION} --info --stacktrace -x test

      - name: Verify and stage Windows MSI
        if: inputs.target == 'windows'
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem build/installer -Filter *.msi)
          if ($installers.Count -ne 1) { throw "Expected one MSI, found $($installers.Count)" }
          ./packaging/windows/test-msi.ps1 -MsiPath $installers[0].FullName
          Copy-Item $installers[0].FullName ("ircafe-{0}-windows-x64.msi" -f $env:BUILD_LABEL)

      - name: Verify Alerter bundle (macOS)
        if: inputs.target == 'mac'
        shell: bash
        run: |
          set -euo pipefail
          alerter_path="build/dist/IRCafe.app/Contents/Resources/alerter"
          if [[ ! -f "$alerter_path" ]]; then
            echo "::error::Missing Alerter binary at expected path: $alerter_path"
            echo "Contents/Resources snapshot:"
            find build/dist/IRCafe.app/Contents/Resources -maxdepth 4 -mindepth 1 -print || true
            exit 1
          fi
          lipo "$alerter_path" -verify_arch arm64 x86_64
          test -f build/dist/IRCafe.app/Contents/Resources/Alerter-LICENSE
          codesign --verify --deep --strict build/dist/IRCafe.app

      - name: Archive Linux app-image
        if: inputs.target == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          cd build/dist
          tar -czf "../../${ARTIFACT_PATH}" .

      - name: Archive macOS app-image
        if: inputs.target == 'mac'
        shell: bash
        run: |
          set -euo pipefail
          cd build/dist
          ditto -c -k --sequesterRsrc --keepParent "IRCafe.app" "../../${ARTIFACT_PATH}"

      - name: Archive Windows app-image
        if: inputs.target == 'windows'
        shell: pwsh
        run: |
          Compress-Archive -Path build\dist\* -DestinationPath $env:ARTIFACT_PATH

      - name: Build Flatpak bundle
        if: inputs.target == 'flatpak'
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon clean jpackage generateFlatpakMetainfo -Pversion=${RELEASE_VERSION} --info --stacktrace -x test

      - name: Install Flatpak tooling
        if: inputs.target == 'flatpak'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak remotes --user
          flatpak --version
          flatpak-builder --version

      - name: Package Flatpak bundle
        if: inputs.target == 'flatpak'
        shell: bash
        run: |
          set -euo pipefail
          flatpak-builder \
            --user \
            --force-clean \
            --repo=build/flatpak/repo \
            --default-branch=stable \
            --install-deps-from=flathub \
            build/flatpak/workdir \
            packaging/flatpak/cafe.woden.IRCafe.yml

          flatpak build-bundle \
            build/flatpak/repo \
            "${ARTIFACT_PATH}" \
            cafe.woden.IRCafe \
            stable \
            --runtime-repo=https://flathub.org/repo/flathub.flatpakrepo

      - name: Upload selected artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          if-no-files-found: error
          retention-days: 14
          path: ${{ env.ARTIFACT_PATH }}

      - name: Upload Linux installers
        if: inputs.target == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}-installers
          if-no-files-found: error
          retention-days: 14
          path: |
            ircafe-${{ env.BUILD_LABEL }}-linux-x64.deb
            ircafe-${{ env.BUILD_LABEL }}-linux-x64.rpm

      - name: Upload Windows MSI
        if: inputs.target == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}-msi
          if-no-files-found: error
          retention-days: 14
          path: ircafe-${{ env.BUILD_LABEL }}-windows-x64.msi

      - name: Add run summary
        shell: bash
        run: |
          {
            echo "### Manual test build"
            echo
            echo "- Source ref: \`${SOURCE_REF}\`"
            echo "- Commit: \`${SHORT_SHA}\`"
            echo "- Target: \`${{ inputs.target }}\`"
            echo "- Artifact: \`${ARTIFACT_NAME}\`"
          } >> "$GITHUB_STEP_SUMMARY"
