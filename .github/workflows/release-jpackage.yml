name: Release (jpackage + flatpak)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    name: Verify tagged commit
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      JAVA_TOOL_OPTIONS: -Djava.awt.headless=true

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify release
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon lint test integrationTest architectureTest functionalTest \
            -Pversion="${GITHUB_REF_NAME#v}" --stacktrace

      - name: Upload verification reports
        if: ${{ always() && github.ref_type == 'tag' }}
        uses: actions/upload-artifact@v4
        with:
          name: release-verification-${{ github.run_attempt }}
          if-no-files-found: ignore
          retention-days: 7
          path: |
            **/build/reports/
            **/build/test-results/

  bootjar:
    needs: verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compute release version
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "RELEASE_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            # Unique label for manual runs; still numeric-ish enough if you pass it into Gradle
            echo "RELEASE_VERSION=0.0.0" >> "$GITHUB_ENV"
            echo "RELEASE_LABEL=dev-${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          fi

      - name: Ensure release label (tags)
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${RELEASE_LABEL:-}" ]]; then
            echo "RELEASE_LABEL=${RELEASE_VERSION}" >> "$GITHUB_ENV"
          fi

      - name: Build bootJar
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon clean bootJar -Pversion=${RELEASE_VERSION} --info --stacktrace -x test

      - name: Verify bootJar path
        shell: bash
        run: |
          set -euo pipefail
          ls -la build/libs
          test -f "build/libs/ircafe-${RELEASE_VERSION}.jar"

      - name: Upload bootJar (workflow artifact)
        uses: actions/upload-artifact@v4
        with:
          name: ircafe-${{ env.RELEASE_LABEL }}-bootjar
          path: build/libs/ircafe-${{ env.RELEASE_VERSION }}.jar

      - name: Publish bootJar to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          # Generate notes once; downstream package uploads preserve the release body.
          generate_release_notes: true
          files: build/libs/ircafe-${{ env.RELEASE_VERSION }}.jar

  package:
    needs: bootjar
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            suffix: linux-x64
          - os: ubuntu-24.04-arm
            suffix: linux-arm64
          - os: windows-latest
            suffix: windows-x64
          - os: macos-15
            suffix: macos-arm64
          - os: macos-15-intel
            suffix: macos-x64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compute release version
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "RELEASE_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "RELEASE_VERSION=0.0.0" >> "$GITHUB_ENV"
            echo "RELEASE_LABEL=dev-${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          fi

      - name: Ensure release label (tags)
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${RELEASE_LABEL:-}" ]]; then
            echo "RELEASE_LABEL=${RELEASE_VERSION}" >> "$GITHUB_ENV"
          fi

      - name: Build app-image with jpackage
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon clean jpackage -Pversion=${RELEASE_VERSION} --info --stacktrace -x test

      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y fakeroot dpkg-dev rpm curl file

      - name: Build Linux DEB and RPM packages
        if: runner.os == 'Linux'
        shell: bash
        run: bash packaging/linux/build-native-packages.sh "${RELEASE_VERSION}"

      - name: Verify and stage Linux packages
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          for format in deb rpm; do
            packages=(build/installer/"${format}"/*."${format}")
            if [[ ${#packages[@]} -ne 1 || ! -f "${packages[0]}" ]]; then
              echo "::error::Expected exactly one ${format} package"
              exit 1
            fi
            image=ubuntu:24.04
            if [[ "$format" == rpm ]]; then image=fedora:43; fi
            docker run --rm \
              -v "$PWD/build:/packages:ro" \
              -v "$PWD/packaging/linux:/checks:ro" \
              "$image" bash /checks/test-native-package.sh \
              "/packages/installer/${format}/$(basename "${packages[0]}")" \
              "/packages/installer-test/previous.${format}"
            cp "${packages[0]}" "ircafe-${RELEASE_LABEL}-${{ matrix.suffix }}.${format}"
          done

      - name: Build and verify Linux AppImage
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon jpackageAppImage -Pversion="${RELEASE_VERSION}" -x test
          images=(build/installer/appimage/*.AppImage)
          if [[ ${#images[@]} -ne 1 || ! -f "${images[0]}" ]]; then
            echo "::error::Expected exactly one AppImage"
            exit 1
          fi
          for system in ubuntu:24.04 fedora:43; do
            docker run --rm \
              -v "$PWD/build/installer/appimage:/packages:ro" \
              -v "$PWD/packaging/appimage:/checks:ro" \
              "$system" bash /checks/test-appimage.sh "/packages/$(basename "${images[0]}")"
          done
          cp "${images[0]}" "ircafe-${RELEASE_LABEL}-${{ matrix.suffix }}.AppImage"

      - name: Add WiX to PATH (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not $env:WIX) { throw 'WiX Toolset is not installed on this runner' }
          $wixBin = Join-Path $env:WIX 'bin'
          foreach ($tool in @('candle.exe', 'light.exe')) {
            if (-not (Test-Path (Join-Path $wixBin $tool))) { throw "Missing WiX tool: $tool" }
          }
          $wixBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build Windows MSI
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon jpackageMsi -Pversion=${RELEASE_VERSION} --info --stacktrace -x test

      - name: Verify and stage Windows MSI
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem build/installer -Filter *.msi)
          if ($installers.Count -ne 1) { throw "Expected one MSI, found $($installers.Count)" }
          ./packaging/windows/test-msi.ps1 -MsiPath $installers[0].FullName
          Copy-Item $installers[0].FullName ("ircafe-{0}-${{ matrix.suffix }}.msi" -f $env:RELEASE_LABEL)

      - name: Verify Alerter bundle (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          alerter_path="build/dist/IRCafe.app/Contents/Resources/alerter"
          if [[ ! -f "$alerter_path" ]]; then
            echo "::error::Missing Alerter binary at expected path: $alerter_path"
            echo "Contents/Resources snapshot:"
            find build/dist/IRCafe.app/Contents/Resources -maxdepth 4 -mindepth 1 -print || true
            exit 1
          fi
          lipo "$alerter_path" -verify_arch arm64 x86_64
          test -f build/dist/IRCafe.app/Contents/Resources/Alerter-LICENSE
          codesign --verify --deep --strict build/dist/IRCafe.app

      # ---- Create an archive per OS ----

      - name: Archive (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          cd build/dist
          tar -czf ../../ircafe-${RELEASE_LABEL}-${{ matrix.suffix }}.tar.gz .
          cd ../..

      - name: Archive (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          cd build/dist
          ditto -c -k --sequesterRsrc --keepParent "IRCafe.app" "../../ircafe-${RELEASE_LABEL}-${{ matrix.suffix }}.zip"
          cd ../..

      - name: Archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path build\dist\* -DestinationPath ("ircafe-{0}-{1}.zip" -f $env:RELEASE_LABEL, "${{ matrix.suffix }}")

      - name: Upload artifact (workflow)
        uses: actions/upload-artifact@v4
        with:
          name: ircafe-${{ env.RELEASE_LABEL }}-${{ matrix.suffix }}
          if-no-files-found: error
          path: |
            ircafe-${{ env.RELEASE_LABEL }}-${{ matrix.suffix }}.zip
            ircafe-${{ env.RELEASE_LABEL }}-${{ matrix.suffix }}.tar.gz
            ircafe-${{ env.RELEASE_LABEL }}-${{ matrix.suffix }}.msi
            ircafe-${{ env.RELEASE_LABEL }}-${{ matrix.suffix }}.deb
            ircafe-${{ env.RELEASE_LABEL }}-${{ matrix.suffix }}.rpm
            ircafe-${{ env.RELEASE_LABEL }}-${{ matrix.suffix }}.AppImage

      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ircafe-${{ env.RELEASE_LABEL }}-${{ matrix.suffix }}.zip
            ircafe-${{ env.RELEASE_LABEL }}-${{ matrix.suffix }}.tar.gz
            ircafe-${{ env.RELEASE_LABEL }}-${{ matrix.suffix }}.msi
            ircafe-${{ env.RELEASE_LABEL }}-${{ matrix.suffix }}.deb
            ircafe-${{ env.RELEASE_LABEL }}-${{ matrix.suffix }}.rpm
            ircafe-${{ env.RELEASE_LABEL }}-${{ matrix.suffix }}.AppImage

  flatpak:
    needs: bootjar
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compute release version
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "RELEASE_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "RELEASE_VERSION=0.0.0" >> "$GITHUB_ENV"
            echo "RELEASE_LABEL=dev-${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          fi

      - name: Ensure release label (tags)
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${RELEASE_LABEL:-}" ]]; then
            echo "RELEASE_LABEL=${RELEASE_VERSION}" >> "$GITHUB_ENV"
          fi

      - name: Build app-image with jpackage
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon clean jpackage generateFlatpakMetainfo -Pversion=${RELEASE_VERSION} --info --stacktrace -x test

      - name: Install Flatpak tooling
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak remotes --user
          flatpak --version
          flatpak-builder --version

      - name: Build Flatpak bundle
        shell: bash
        run: |
          set -euo pipefail
          flatpak-builder \
            --user \
            --force-clean \
            --repo=build/flatpak/repo \
            --default-branch=stable \
            --install-deps-from=flathub \
            build/flatpak/workdir \
            packaging/flatpak/cafe.woden.IRCafe.yml

          flatpak build-bundle \
            build/flatpak/repo \
            ircafe-${RELEASE_LABEL}-linux-x64.flatpak \
            cafe.woden.IRCafe \
            stable \
            --runtime-repo=https://flathub.org/repo/flathub.flatpakrepo

      - name: Upload artifact (workflow)
        uses: actions/upload-artifact@v4
        with:
          name: ircafe-${{ env.RELEASE_LABEL }}-linux-x64-flatpak
          if-no-files-found: error
          path: ircafe-${{ env.RELEASE_LABEL }}-linux-x64.flatpak

      - name: Publish Flatpak to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ircafe-${{ env.RELEASE_LABEL }}-linux-x64.flatpak
