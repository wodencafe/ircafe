def libsCatalog = extensions.getByType(org.gradle.api.artifacts.VersionCatalogsExtension).named("libs")
def catalogVersion = { String alias -> libsCatalog.findVersion(alias).get().requiredVersion }
def booleanProperty = { String name, String defaultValue ->
    (findProperty(name) ?: defaultValue).toString().toBoolean()
}
def intProperty = { String name, String defaultValue ->
    Integer.parseInt((findProperty(name) ?: defaultValue).toString())
}
def junitPlatformVersion = catalogVersion('junitPlatform')

configurations.configureEach {
    resolutionStrategy.eachDependency { details ->
        if (details.requested.group == 'org.junit.platform'
                && details.requested.name == 'junit-platform-launcher') {
            details.useVersion junitPlatformVersion
            details.because 'Keep JUnit Platform launcher aligned with the JUnit 6 engine.'
        }
    }
}

configurations {
    mutationTestTool
}

testlogger {
    theme 'standard-parallel'
    showPassed false
    showSkipped true
    showFailed true
    showStandardStreams false
    slowThreshold 2000
}

pitest {
    pitestVersion = catalogVersion('pitestCommandLine')
    junit5PluginVersion = catalogVersion('pitestJunit5Plugin')
    targetClasses = ['cafe.woden.ircclient.*']
    targetTests = ['cafe.woden.ircclient.*']
    outputFormats = ['HTML', 'XML']
    threads = intProperty('pitestThreads', '4')
    timestampedReports = false
    failWhenNoMutations = false
}

jmh {
    fork = intProperty('jmhForks', '1')
    iterations = intProperty('jmhIterations', '5')
    warmupIterations = intProperty('jmhWarmupIterations', '3')
    resultFormat = 'JSON'
    resultsFile = layout.buildDirectory.file('reports/jmh/results.json').get().asFile
    humanOutputFile = layout.buildDirectory.file('reports/jmh/human.txt').get().asFile
    includeTests = true
    duplicateClassesStrategy = DuplicatesStrategy.WARN
}

sourceSets {
    functionalTest {
        java.srcDir('src/functionalTest/java')
        resources.srcDir('src/functionalTest/resources')
        compileClasspath += sourceSets.main.output + sourceSets.test.output + configurations.testRuntimeClasspath
        runtimeClasspath += output + sourceSets.test.output + compileClasspath
    }
}

configurations.named('functionalTestImplementation') {
    extendsFrom(configurations.testImplementation)
}
configurations.named('functionalTestRuntimeOnly') {
    extendsFrom(configurations.testRuntimeOnly)
}

tasks.named('test') {
    useJUnitPlatform()
    filter {
        // Functional Swing coverage lives in src/functionalTest and runs via the dedicated task.
        excludeTestsMatching '*FunctionalTest'
        // Integration coverage runs via the dedicated integrationTest task.
        excludeTestsMatching '*IntegrationTest'
        // Architecture guardrails run via the dedicated architectureTest task.
        excludeTestsMatching 'cafe.woden.ircclient.architecture.*'
        excludeTestsMatching 'cafe.woden.ircclient.modulith.*'
    }
}

def enableTestRetry = System.getenv("CI") == "true" || booleanProperty('testRetry', 'false')
tasks.withType(Test).configureEach {
    testLogging {
        events 'FAILED', 'SKIPPED'
        exceptionFormat 'full'
        showCauses true
        showExceptions true
        showStackTraces true
        showStandardStreams false
    }

    retry {
        maxRetries = enableTestRetry ? intProperty('testRetryMaxRetries', '1') : 0
        maxFailures = intProperty('testRetryMaxFailures', '20')
        failOnPassedAfterRetry = true
        failOnSkippedAfterRetry = true
    }
}

tasks.register('integrationTest', Test) {
    group = 'verification'
    description = 'Runs test-source-set integration tests (classes ending with IntegrationTest).'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform()
    filter {
        includeTestsMatching '*IntegrationTest'
    }
    shouldRunAfter(tasks.named('test'))
}

tasks.register('architectureTest', Test) {
    group = 'verification'
    description = 'Runs architecture and modulith guardrail tests.'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform()
    filter {
        includeTestsMatching 'cafe.woden.ircclient.architecture.*'
        includeTestsMatching 'cafe.woden.ircclient.modulith.*'
    }
    shouldRunAfter(tasks.named('test'))
}

tasks.register('functionalTest', Test) {
    group = 'verification'
    description = 'Runs Swing functional smoke tests.'
    // Explicit opt-in for real dialog tests under a desktop session or xvfb-run.
    systemProperty 'java.awt.headless', providers.gradleProperty('functionalTestHeadless').getOrElse('true')
    testClassesDirs = sourceSets.functionalTest.output.classesDirs
    classpath = sourceSets.functionalTest.runtimeClasspath
    useJUnitPlatform()
    filter {
        includeTestsMatching '*FunctionalTest'
    }
    shouldRunAfter(tasks.named('test'))
}

tasks.register('ircv3Showcase', JavaExec) {
    group = 'application'
    description = 'Launches the full IRCafe window against a real Ergo-backed IRCv3 showcase scene.'
    dependsOn(tasks.named('functionalTestClasses'))
    classpath = sourceSets.functionalTest.runtimeClasspath
    mainClass = 'cafe.woden.ircclient.irc.pircbotx.client.Ircv3ErgoShowcaseManualLauncher'
    standardInput = System.in

    System.getProperties().each { key, value ->
        String k = key == null ? '' : key.toString()
        if (!k.startsWith('ircv3.showcase.')) {
            return
        }
        systemProperty k, value
    }
}

tasks.register('pitestIgnoreCompatibility', JavaExec) {
    group = 'verification'
    description = 'Runs PIT mutation checks for ignore normalization and irssi parsing paths.'
    dependsOn(tasks.named('testClasses'))
    classpath = configurations.mutationTestTool
    mainClass = 'org.pitest.mutationtest.commandline.MutationCoverageReport'

    def reportDirProvider = layout.buildDirectory.dir('reports/pitest/ignore-compatibility')
    inputs.files(sourceSets.main.output, sourceSets.test.output, configurations.testRuntimeClasspath)
    outputs.dir(reportDirProvider)

    doFirst {
        String testClasspath =
            files(
                sourceSets.main.output,
                sourceSets.test.output,
                sourceSets.main.runtimeClasspath,
                sourceSets.test.runtimeClasspath
            ).files.collect { it.absolutePath }.join(',')
        String mutableCodePaths =
            sourceSets.main.output.classesDirs.files.collect { it.absolutePath }.join(',')
        args = [
            "--reportDir=${reportDirProvider.get().asFile.absolutePath}",
            '--outputFormats=HTML,XML',
            '--targetClasses=cafe.woden.ircclient.ignore.api.IgnoreMaskNormalizer*',
            '--targetClasses=cafe.woden.ircclient.app.outbound.OutboundIgnoreCommandService*',
            '--targetTests=cafe.woden.ircclient.ignore.api.IgnoreMaskNormalizerTest*',
            '--targetTests=cafe.woden.ircclient.app.outbound.OutboundIgnoreCommandServiceTest*',
            "--sourceDirs=${file('src/main/java').absolutePath}",
            "--mutableCodePaths=${mutableCodePaths}",
            "--classPath=${testClasspath}",
            '--threads=4',
            '--testPlugin',
            'junit5',
            '--verbose=true',
            '--failWhenNoMutations=false'
        ]
    }
}

