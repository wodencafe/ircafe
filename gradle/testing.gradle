tasks.register('themeValidate', Test) {
    group = 'verification'
    description = 'Runs Swing theme validation smoke tests.'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform()
    filter {
        includeTestsMatching 'cafe.woden.ircclient.ui.settings.ThemeValidatorTest'
    }
}

def configureJacocoReport = { reportTask ->
    reportTask.reports {
        html.required = true
        xml.required = true
        csv.required = false
    }
    reportTask.doFirst {
        reportTask.executionData.setFrom(reportTask.executionData.files.findAll { it.exists() })
    }
}

tasks.named('jacocoTestReport', org.gradle.testing.jacoco.tasks.JacocoReport) {
    group = 'verification'
    description = 'Generates JaCoCo coverage for unit and non-functional tests.'
    dependsOn(tasks.named('test'))
    sourceSets sourceSets.main
    configureJacocoReport(delegate)
}

tasks.register('jacocoIntegrationTestReport', org.gradle.testing.jacoco.tasks.JacocoReport) {
    group = 'verification'
    description = 'Generates JaCoCo coverage for integration tests.'
    dependsOn(tasks.named('integrationTest'))
    executionData(tasks.named('integrationTest'))
    sourceSets sourceSets.main
    configureJacocoReport(delegate)
}

tasks.register('jacocoFunctionalTestReport', org.gradle.testing.jacoco.tasks.JacocoReport) {
    group = 'verification'
    description = 'Generates JaCoCo coverage for Swing functional tests.'
    dependsOn(tasks.named('functionalTest'))
    executionData(tasks.named('functionalTest'))
    sourceSets sourceSets.main
    configureJacocoReport(delegate)
}

tasks.register('coverageReport', org.gradle.testing.jacoco.tasks.JacocoReport) {
    group = 'verification'
    description = 'Generates aggregate JaCoCo coverage for test, integrationTest, and functionalTest.'
    dependsOn(tasks.named('test'), tasks.named('integrationTest'), tasks.named('functionalTest'))
    executionData(tasks.named('test'), tasks.named('integrationTest'), tasks.named('functionalTest'))
    sourceSets sourceSets.main
    configureJacocoReport(delegate)
}

tasks.register('quickCheck') {
    group = 'verification'
    description = 'Runs fast local feedback checks: formatting and unit/non-functional tests.'
    dependsOn('spotlessCheck', 'test')
}

tasks.register('verifyUiChange') {
    group = 'verification'
    description = 'Runs verification normally needed for Swing UI behavior changes.'
    dependsOn('test', 'functionalTest')
}

tasks.register('verifySpringChange') {
    group = 'verification'
    description = 'Runs verification normally needed for Spring wiring or integration changes.'
    dependsOn('test', 'integrationTest')
}

tasks.register('verifyArchitectureChange') {
    group = 'verification'
    description = 'Runs verification normally needed for architecture or module-boundary changes.'
    dependsOn('test', 'architectureTest')
}

tasks.register('verifyRefactor') {
    group = 'verification'
    description = 'Runs broad verification for behavior-preserving refactors.'
    dependsOn('lint', 'test', 'architectureTest')
}
